# XcodeGen spec for Forkcast.
# Usage (on a Mac):  brew install xcodegen && xcodegen generate
#
# To change bundle identifiers, edit BUNDLE_ID_PREFIX below (one place).
# The App Group / iCloud container identifiers are derived from it in the
# entitlements, but are ALSO hard-coded in ForkcastCore/SharedConstants.swift
# (appGroupId, cloudKitContainerId) — keep both in sync.

name: Forkcast

options:
  bundleIdPrefix: com.forkcast
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    BUNDLE_ID_PREFIX: com.forkcast.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSET_CATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""   # set your Team ID here or in Xcode
    CODE_SIGN_STYLE: Automatic

packages:
  ForkcastCore:
    path: Packages/ForkcastCore

fileGroups:
  - BUILD_NOTES.md
  - Forkcast/Resources/Forkcast.storekit

targets:
  Forkcast:
    type: application
    platform: iOS
    sources:
      - path: Forkcast
        excludes:
          - "Resources/Forkcast.storekit"
          - "**/*.md"
          - "Supporting/Info.plist"
          - "Supporting/Forkcast.entitlements"
    dependencies:
      - package: ForkcastCore
      - target: ForkcastWidget
        embed: true
      - target: ForkcastShare
        embed: true
      - sdk: StoreKit.framework
      - sdk: WidgetKit.framework
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: Forkcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Forkcast
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Forkcast/Supporting/Forkcast.entitlements
    info:
      path: Forkcast/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Forkcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: cream
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Light
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).deeplink
            CFBundleURLSchemes:
              - forkcast
        CFBundleLocalizations:
          - en
    entitlements:
      path: Forkcast/Supporting/Forkcast.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.forkcast.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.forkcast.app
        com.apple.developer.applesignin:
          - Default

  ForkcastWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ForkcastWidget
        excludes:
          - "Info.plist"
          - "ForkcastWidget.entitlements"
    dependencies:
      - package: ForkcastCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widget
        PRODUCT_NAME: ForkcastWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ForkcastWidget/ForkcastWidget.entitlements
    info:
      path: ForkcastWidget/Info.plist
      properties:
        CFBundleDisplayName: Forkcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ForkcastWidget/ForkcastWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.forkcast.app

  ForkcastShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ForkcastShare
        excludes:
          - "Info.plist"
          - "ForkcastShare.entitlements"
    dependencies:
      - package: ForkcastCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        PRODUCT_NAME: ForkcastShare
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: ForkcastShare/ForkcastShare.entitlements
    info:
      path: ForkcastShare/Info.plist
      properties:
        CFBundleDisplayName: Forkcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ForkcastShare/ForkcastShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.forkcast.app

schemes:
  Forkcast:
    build:
      targets:
        Forkcast: all
    run:
      config: Debug
      storeKitConfiguration: Forkcast/Resources/Forkcast.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
